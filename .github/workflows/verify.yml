name: Verify analytics
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: analytics_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ./mvnw -B -ntp verify
        working-directory: backend
        env:
          TEST_MYSQL_URL: jdbc:mysql://localhost:3306/analytics_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          TEST_MYSQL_USERNAME: root
          TEST_MYSQL_PASSWORD: test_root_password
