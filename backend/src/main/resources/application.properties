spring.application.name=queue-analytics
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/queue_analytics?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
analytics.park-id=${PARK_ID:335}
analytics.source-url=${SOURCE_URL:https://queue-times.com/parks/335/queue_times.json}
analytics.zone=${DISPLAY_TIMEZONE:Asia/Riyadh}
analytics.interval-minutes=${COLLECTION_INTERVAL_MINUTES:5}
analytics.stale-minutes=${STALE_MINUTES:15}
analytics.low-coverage-samples=${LOW_COVERAGE_SAMPLES:6}
analytics.collector-enabled=${COLLECTOR_ENABLED:true}
analytics.cors-origins=${CORS_ORIGINS:}

analytics.collection-window-enabled=${COLLECTION_WINDOW_ENABLED:false}
analytics.collection-start-hour=${COLLECTION_START_HOUR:16}
analytics.collection-end-hour=${COLLECTION_END_HOUR:24}

analytics.collection-closed-days=${COLLECTION_CLOSED_DAYS:}
