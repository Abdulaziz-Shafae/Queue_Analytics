services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-queue_analytics}
      MYSQL_USER: ${MYSQL_USER:-queue_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - queue_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  analytics:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-queue_analytics}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DATABASE_USERNAME: ${MYSQL_USER:-queue_user}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      SOURCE_URL: ${SOURCE_URL:-https://queue-times.com/parks/335/queue_times.json}
      COLLECTION_INTERVAL_MINUTES: ${COLLECTION_INTERVAL_MINUTES:-5}
      STALE_MINUTES: ${STALE_MINUTES:-15}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  queue_data:
